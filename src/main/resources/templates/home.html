<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>PickleReserve</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="~{_nav :: nav(${user})}"></div><main class="wrap"><h1>Reserve a court or coaching session</h1><p>Browse available pickleball times, book as a player, or manage availability as a provider.</p><div class="grid"><div class="card"><h3>Providers</h3><b th:text="${home.providerCount}"></b></div><div class="card"><h3>Services</h3><b th:text="${home.serviceCount}"></b></div><div class="card"><h3>Open slots</h3><b th:text="${home.openSlotCount}"></b></div></div><h2>Next available</h2><div class="card" th:each="slot:${home.nextAvailableSlots}"><b th:text="${slot.serviceName}"></b> with <span th:text="${slot.providerName}"></span><br><span th:text="${slot.startsAt}"></span> - $<span th:text="${slot.priceDollars}"></span></div><a class="btn" href="/slots">View all slots</a></main></body></html>
