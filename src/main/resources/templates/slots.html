<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Slots</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="~{_nav :: nav(${user})}"></div><main class="wrap"><h1>Available Slots</h1><form class="card" method="get"><input name="providerId" th:value="${providerId}" placeholder="Provider ID"><input name="serviceId" th:value="${serviceId}" placeholder="Service ID"><input name="date" type="date" th:value="${date}"><button>Filter</button></form><div class="card" th:each="slot:${slots.content}"><h3 th:text="${slot.serviceName}"></h3><p><span th:text="${slot.providerName}"></span> · <span th:text="${slot.startsAt}"></span> · $<span th:text="${slot.priceDollars}"></span></p><form th:if="${user != null and user.role == 'PLAYER'}" method="post" action="/book"><input type="hidden" name="slotId" th:value="${slot.slotId}"><input type="hidden" name="serviceId" th:value="${slot.serviceId}"><button>Book</button></form><a th:if="${user == null}" href="/login">Login to book</a></div></main></body></html>
