<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Provider</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="~{_nav :: nav(${user})}"></div><main class="wrap"><h1>Provider Dashboard</h1><div class="msg" th:if="${message}" th:text="${message}"></div><div class="card"><h2>Create availability</h2><form method="post" action="/provider/slots"><input name="serviceId" type="number" min="1" placeholder="Service ID" required><input name="startsAt" placeholder="2026-10-15T09:00:00-07:00" required><input name="endsAt" placeholder="2026-10-15T10:00:00-07:00" required><button>Create</button></form></div><h2>My open availability</h2><table><tr><th>Service</th><th>Time</th><th></th></tr><tr th:each="slot:${slots}"><td th:text="${slot.serviceName}"></td><td th:text="${slot.startsAt}"></td><td><form th:action="@{'/provider/slots/'+${slot.slotId}+'/remove'}" method="post"><button>Remove</button></form></td></tr></table><h2>Appointments booked with me</h2><table><tr><th>Customer</th><th>Service</th><th>Time</th><th>Status</th></tr><tr th:each="a:${appointments}"><td th:text="${a.customerName}"></td><td th:text="${a.serviceName}"></td><td th:text="${a.startsAt}"></td><td th:text="${a.status}"></td></tr></table><p><small>Provider slot removal is also available through DELETE /api/provider/slots/{id} and POST /provider/slots/{id}/remove.</small></p></main></body></html>
