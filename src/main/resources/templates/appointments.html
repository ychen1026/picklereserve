<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>My Appointments</title><link rel="stylesheet" href="/style.css"></head><body><div th:replace="~{_nav :: nav(${user})}"></div><main class="wrap"><h1>My Appointments</h1><div class="msg" th:if="${message}" th:text="${message}"></div><table><tr><th>Service</th><th>Provider</th><th>Time</th><th>Status</th><th></th></tr><tr th:each="a:${appointments}"><td th:text="${a.serviceName}"></td><td th:text="${a.providerName}"></td><td th:text="${a.startsAt}"></td><td th:text="${a.status}"></td><td><form th:if="${a.status == 'BOOKED'}" th:action="@{'/appointments/'+${a.appointmentId}+'/cancel'}" method="post"><button>Cancel</button></form></td></tr></table></main></body></html>
