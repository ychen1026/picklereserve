spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}
