spring.application.name=PickleReserve
server.port=${SERVER_PORT:8080}
spring.datasource.url=${PICKLERESERVE_DB_URL:jdbc:sqlite:picklereserve.db}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:seed.sql
spring.sql.init.continue-on-error=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
logging.level.edu.sjsu.cmpe172.picklereserve=INFO
notification.gateway.enabled=${NOTIFICATION_ENABLED:true}
notification.gateway.base-url=${NOTIFICATION_BASE_URL:http://localhost:${server.port}}
notification.gateway.connect-timeout=500ms
notification.gateway.read-timeout=1s
notification.gateway.max-attempts=3
notification.gateway.retry-backoff=200ms
